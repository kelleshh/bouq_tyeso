services:
  mp-alerts-bot:
    build: .
    container_name: mp-alerts-bot
    env_file:
      - .env
    ports:
      - "80:8000"
    restart: unless-stopped

  mp-alerts-configure:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    command: ["bot", "configure"]
    stdin_open: true
    tty: true
    restart: "no"
